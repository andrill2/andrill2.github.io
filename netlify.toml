# Configuração de deploy no Netlify (site estático)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: qualquer rota que não seja um arquivo existente cai no index.html.
# Arquivos reais (social.json, /mockups/*, /clientes/*) são servidos antes desta regra.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
